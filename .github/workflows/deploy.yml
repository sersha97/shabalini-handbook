name: Build and deploy to shabalini.com/handbook

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 build.py
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/

  deploy:
    # Deploys only from main
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site/
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Upload to hosting (ADM.TOOLS) via FTPS, with automatic retries
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          lftp --env-password -u "$FTP_USERNAME" "$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set net:max-retries 10
          set net:reconnect-interval-base 5
          set net:timeout 30
          mirror --reverse --delete --no-perms --parallel=1 --verbose --exclude-glob .htaccess --exclude-glob .well-known/ site/ $FTP_SERVER_DIR
          bye
          EOF
