name: One-time move to handbook v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace MkDocs source with v2 source
        run: |
          set -e
          test -f handbook-src.zip
          mkdir -p /tmp/src
          unzip -q -o handbook-src.zip -d /tmp/src
          git rm -r -q --ignore-unmatch docs mkdocs.yml requirements.txt scripts README.md .gitignore handbook-src.zip
          cp -r /tmp/src/. .
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Handbook v2: library → subject → chapter (45 chapters)"
          git push
