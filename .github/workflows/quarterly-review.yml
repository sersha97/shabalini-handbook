name: Quarterly guideline review

on:
  schedule:
    - cron: "0 13 1 1,4,7,10 *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: List chapters not reviewed in 90 days
        run: python3 scripts/stale_pages.py > review.md
      - name: Open review issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue create --title "Quarterly guideline review — $(date +%Y-%m)" --body-file review.md
