site_name: Hospitalist Handbook
site_description: A practical, board-ready hospital medicine handbook by Serhii Shabalin, MD
site_author: Serhii Shabalin, MD
site_url: https://shabalini.com/handbook/
copyright: Educational use only — not medical advice. &copy; Serhii Shabalin, MD

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.tabs.link
    - toc.follow
  icon:
    logo: material/heart-pulse

extra_css:
  - stylesheets/extra.css

extra:
  homepage: https://shabalini.com

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

exclude_docs: |
  _template.md

nav:
  - Home: index.md
  - Updates: updates.md
  - Cardiology:
      - cardiology/index.md
      - Atrial fibrillation: cardiology/atrial-fibrillation.md
  - Disclaimer: disclaimer.md
